services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: wifi
      POSTGRES_PASSWORD: wifi
      POSTGRES_DB: wifi
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./certs:/certs:ro
      - ./docker/postgres-entrypoint.sh:/postgres-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/postgres-entrypoint.sh"]
  redis:
    image: redis:7
    ports:
      - "6380:6379"
    volumes:
      - ./certs:/certs:ro
      - ./docker/redis-entrypoint.sh:/redis-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/redis-entrypoint.sh"]
volumes:
  pgdata:
