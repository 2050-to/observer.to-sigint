appId: com.wifimapping.app
productName: Observer.to
directories:
  output: release
files:
  - dist/**/*
  - electron/dist/**/*
  - macos/addon/build/Release/scanner.node
  - package.json
asarUnpack:
  - "**/*.node"
extraResources:
  - from: build-resources
    to: .
    filter:
      - ca.crt
mac:
  identity: null
  hardenedRuntime: false
  target:
    - dir
  extendInfo:
    NSLocationUsageDescription: Observer.to uses your location to record where each network was heard.
    NSLocationWhenInUseUsageDescription: Observer.to uses your location to record where each network was heard.
    NSBluetoothAlwaysUsageDescription: Observer.to listens for nearby Bluetooth advertisements while a drive is running.
